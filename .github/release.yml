changelog:
  exclude:
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance
      labels:
        - chore
        - ci
        - refactor
        - dependencies
    - title: Other Changes
      labels:
        - '*'
